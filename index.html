<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3c4">
  <title>오늘 뭐 먹지?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>오늘 뭐 먹지?</h1>
      <button id="themeBtn" class="mini theme-btn" type="button" aria-pressed="false">🌙 다크</button>
    </header>

    <section class="card result-card" aria-live="polite">
      <p class="result-label">오늘의 메뉴</p>
      <p id="result" class="result">🍽️ 뽑기를 눌러봐!</p>
      <div class="result-actions">
        <a id="mapLink" class="map-link" href="#" target="_blank" rel="noopener" hidden></a>
        <button id="eatBtn" class="map-link eat-btn" type="button" hidden>✅ 이걸로 먹을게요</button>
      </div>
      <p id="error" class="error" role="alert"></p>
      <button id="pickBtn" class="pick-btn" type="button">뽑기</button>
    </section>

    <section class="card">
      <h2>메뉴 목록</h2>

      <input id="searchInput" class="search" type="search" maxlength="20" placeholder="🔍 저장한 메뉴 검색" autocomplete="off" aria-label="저장한 메뉴 검색">

      <div id="filterBar" class="filter-bar" role="group" aria-label="카테고리 필터"></div>

      <div class="toolbar">
        <button id="undoBtn" class="mini on" type="button" disabled>↩ 되돌리기</button>
        <button id="selectAllBtn" class="mini" type="button">전체 선택</button>
        <button id="clearAllBtn" class="mini" type="button">전체 해제</button>
        <button id="resetEatenBtn" class="mini" type="button">먹음 표시 지우기</button>
        <button id="resetMenusBtn" class="mini danger" type="button">기본 메뉴로 초기화</button>
      </div>
      <p id="statusMsg" class="status" role="status"></p>

      <label class="option">
        <input id="excludeEaten" type="checkbox">
        <span>먹은 메뉴 제외하기 <small>(어제·점심에 먹은 메뉴에 '먹음' 표시)</small></span>
      </label>

      <div class="time-mode">
        <label for="timeMode">⏰ 시간대 모드</label>
        <select id="timeMode"></select>
      </div>
      <p id="timeInfo" class="time-info"></p>

      <div class="add-row">
        <input id="menuInput" type="text" maxlength="20" placeholder="메뉴 이름 입력" autocomplete="off">
        <select id="categorySelect" aria-label="카테고리 선택"></select>
        <button id="addBtn" class="add-btn" type="button">추가</button>
      </div>
      <div class="add-times"><span>먹는 시간대</span><div id="addTimes"></div></div>
      <p id="addError" class="error" role="alert"></p>

      <ul id="menuList" class="menu-list"></ul>
      <p id="candidateCount" class="hint"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>최근 기록</h2>
        <button id="clearHistoryBtn" class="mini" type="button">기록 지우기</button>
      </div>
      <ol id="history" class="history"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
